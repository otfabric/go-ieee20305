name: Interop
run-name: "Interop (${{ github.event_name }}) on ${{ github.ref_name }} by @${{ github.actor }}"

# Runs go-ieee20305 against the IEEE 2030.5 implementations published by
# otfabric/ieee20305-interop, as client and as server: our client against the
# Envoy and GridAPPS-D servers, and the GridAPPS-D, py20305 and EPRI clients
# against our server, for every operation and fixture each declares, over
# CCM_8 (the tlsccm module) and GCM where both ends have it. The images are
# consumed as published, pinned by digest in interop/images.go: nothing of
# ieee20305-interop is cloned or built here.

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]
  workflow_dispatch:
    inputs:
      envoy_image:
        description: "Envoy image (default: the pin of interop/images.go)"
        required: false
      gridappsd_image:
        description: "GridAPPS-D image (default: the pin of interop/images.go)"
        required: false
      py20305_image:
        description: "py20305 image (default: the pin of interop/images.go)"
        required: false
      epri_image:
        description: "EPRI image (default: the pin of interop/images.go)"
        required: false

permissions:
  contents: read
  packages: read

env:
  GOWORK: "off"
  # Empty means the pin of interop/images.go.
  IEEE20305_INTEROP_ENVOY_IMAGE: ${{ inputs.envoy_image }}
  IEEE20305_INTEROP_GRIDAPPSD_IMAGE: ${{ inputs.gridappsd_image }}
  IEEE20305_INTEROP_PY20305_IMAGE: ${{ inputs.py20305_image }}
  IEEE20305_INTEROP_EPRI_IMAGE: ${{ inputs.epri_image }}

jobs:
  interop:
    name: Envoy + GridAPPS-D + py20305 + EPRI, client and server
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: interop/go.mod
          cache-dependency-path: interop/go.sum
      - name: Install linters
        run: |
          go install honnef.co/go/tools/cmd/staticcheck@2026.2.2
          curl -sSfL https://raw.githubusercontent.com/golangci/golangci-lint/v2.15.0/install.sh | sh -s -- -b "$(go env GOPATH)/bin" v2.15.0

      - name: Pull the images
        run: |
          images=()
          for name in ENVOY GRIDAPPSD PY20305 EPRI; do
            var="IEEE20305_INTEROP_${name}_IMAGE"
            image="${!var}"
            if [[ -z "${image}" ]]; then
              image=$(grep -o "ghcr.io/otfabric/ieee20305-interop-${name,,}@sha256:[0-9a-f]*" interop/images.go)
            fi
            images+=("${image}")
          done
          # GHCR is occasionally slow or rate limiting: try each pull a few times.
          for image in "${images[@]}"; do
            for attempt in 1 2 3 4 5; do
              docker pull --quiet "${image}" && break
              [[ "${attempt}" == 5 ]] && { echo "::error::cannot pull ${image}"; exit 1; }
              sleep $((attempt * 15))
            done
          done
          {
            echo "| Stack | Image | Upstream | Contract |"
            echo "|---|---|---|---|"
            for image in "${images[@]}"; do
              docker run --rm "${image}" print-capabilities \
                | jq -r --arg image "${image}" '"| \(.adapter) \(.adapterVersion) | `\($image)` | \(.upstream.name) \(.upstream.version) | \(.contractVersion) |"'
            done
          } | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Run the interop suite
        run: |
          set -o pipefail
          mkdir -p artifacts
          make test-interop INTEROP_TESTFLAGS=-v 2>&1 | tee artifacts/interop.log
          {
            echo
            echo "Known upstream bugs (skipped while they reproduce):"
            echo
            grep -o 'KNOWN_BUG [^(]*' artifacts/interop.log | sort -u | sed 's/^/- /' || echo "- none"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload the log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: interop-log
          path: artifacts/
          if-no-files-found: ignore
