name: Interop
run-name: "Interop (${{ github.event_name }}) on ${{ github.ref_name }} by @${{ github.actor }}"

# Runs go-ieee20305 against the IEEE 2030.5 implementations published by
# otfabric/ieee20305-interop, as client and as server: our client against the
# Envoy and GridAPPS-D servers, and the GridAPPS-D, py20305 and EPRI clients
# against our server, for every operation and fixture each declares, over
# CCM_8 (the tlsccm module) and GCM where both ends have it. The images are
# consumed as published: nothing of ieee20305-interop is cloned or built here.

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]
  workflow_dispatch:
    inputs:
      envoy_image:
        description: "Envoy reference image (default: the pinned release)"
        required: false
      gridappsd_image:
        description: "GridAPPS-D reference image (default: the pinned release)"
        required: false
      py20305_image:
        description: "py20305 reference image (default: the pinned release)"
        required: false
      epri_image:
        description: "EPRI reference image (default: the pinned release)"
        required: false

permissions:
  contents: read
  packages: read

env:
  # otfabric/ieee20305-interop v0.4.1 (container contract 0.3): Envoy v2.5.0,
  # GridAPPS-D server v0.19.0 and client v0.1.0, py20305 v0.16.2, EPRI client
  # v0.2.11. Pinned by the multi-arch index digests of its release manifest.
  # Keep in step with interop/images.go.
  IEEE20305_INTEROP_ENVOY_IMAGE: ${{ inputs.envoy_image || 'ghcr.io/otfabric/ieee20305-interop-envoy@sha256:7e040b623dd8fb95b05330270c0d52eb75f5cbf54e243a5b18f6fa8235697359' }}
  IEEE20305_INTEROP_GRIDAPPSD_IMAGE: ${{ inputs.gridappsd_image || 'ghcr.io/otfabric/ieee20305-interop-gridappsd@sha256:40d77b1ecb8a2f7e98a04267c5f25baca96a619c66c79a7b762685975e7ba082' }}
  IEEE20305_INTEROP_PY20305_IMAGE: ${{ inputs.py20305_image || 'ghcr.io/otfabric/ieee20305-interop-py20305@sha256:e42a719905aa2b464d1d9458e2f36d34b8e1533b251a4c9707dc91b4d37389f3' }}
  IEEE20305_INTEROP_EPRI_IMAGE: ${{ inputs.epri_image || 'ghcr.io/otfabric/ieee20305-interop-epri@sha256:ce2be5554928c0dcd4b7f2d78c26c3768f5896b120e38f16a066423946dbcd2d' }}
  GOWORK: "off"

jobs:
  interop:
    name: Envoy + GridAPPS-D + py20305 + EPRI, client and server
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: interop/go.mod
          cache: true
          cache-dependency-path: interop/go.sum

      - name: Install linters
        run: |
          go install honnef.co/go/tools/cmd/staticcheck@2026.2.2
          curl -sSfL https://raw.githubusercontent.com/golangci/golangci-lint/v2.15.0/install.sh | sh -s -- -b "$(go env GOPATH)/bin" v2.15.0

      - name: Pull reference images
        run: |
          images=("${IEEE20305_INTEROP_ENVOY_IMAGE}" "${IEEE20305_INTEROP_GRIDAPPSD_IMAGE}" "${IEEE20305_INTEROP_PY20305_IMAGE}" "${IEEE20305_INTEROP_EPRI_IMAGE}")
          # GHCR is occasionally slow or rate limiting: try each pull a few times.
          for image in "${images[@]}"; do
            for attempt in 1 2 3 4 5; do
              docker pull "${image}" && break
              [[ "${attempt}" == 5 ]] && { echo "::error::cannot pull ${image}"; exit 1; }
              sleep $((attempt * 15))
            done
          done
          {
            echo "| Reference | Image | Upstream | Contract |"
            echo "|---|---|---|---|"
            for image in "${images[@]}"; do
              docker run --rm "${image}" print-capabilities \
                | jq -r --arg image "${image}" '"| \(.adapter) \(.adapterVersion) | `\($image)` | \(.upstream.name) \(.upstream.version) | \(.contractVersion) |"'
            done
          } | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Run the interop suite
        run: |
          set -o pipefail
          mkdir -p artifacts
          make interop INTEROP_TESTFLAGS=-v 2>&1 | tee artifacts/interop.log
          {
            echo
            echo "Known upstream bugs, skipped while they reproduce:"
            echo
            grep -o 'KNOWN_BUG [^(]*' artifacts/interop.log | sort -u | sed 's/^KNOWN_BUG /- /' || echo "- none"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Collect Docker diagnostics on failure
        if: failure()
        run: |
          mkdir -p artifacts
          docker ps -a > artifacts/docker-ps.txt || true
          docker images --digests > artifacts/docker-images.txt || true

      - name: Upload failure artifacts
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: interop-logs
          path: artifacts/
          if-no-files-found: ignore
