name: CI
run-name: "CI (${{ github.event_name }}) on ${{ github.ref_name }} by @${{ github.actor }}"

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

permissions:
  contents: read
  id-token: write

jobs:
  ci:
    uses: otfabric/.github/.github/workflows/go-ci.yml@v2
    with:
      codecov-name: go-ieee20305
      go-versions: '["1.23", "1.24", "1.25", "1.26"]'
    secrets: inherit

  # Downloads the pinned upstream schemas, regenerates the code and fails if
  # it differs from what is committed. Then tests the generated code against
  # the official IEEE examples and validates its output with xmllint against
  # the official IEEE 2030.5 and CSIP-AUS schemas.
  generated-code:
    name: Generated code
    runs-on: ubuntu-latest
    env:
      GOWORK: "off"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Install xmllint
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libxml2-utils
      - name: Cache upstream schemas
        uses: actions/cache@v4
        with:
          path: schemas/upstream
          key: upstream-schemas-${{ hashFiles('schemas/manifest.json') }}
      - name: Check generated headers against the manifest
        run: make generate-verify
      - name: Download, verify and regenerate; fail on drift
        run: make generate-check
      - name: Test against the official examples and schemas
        run: go test -count=1 -race . ./csipaus ./internal/...

  # Statement coverage of the library packages, with the race detector: the
  # gate is COVER_MIN in the Makefile.
  coverage:
    name: Coverage gate
    runs-on: ubuntu-latest
    env:
      GOWORK: "off"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Coverage of at least COVER_MIN percent
        run: make coverage-gate

  # The tests shuffled and run twice with the race detector, to shake out
  # order dependencies and races: the chaos and parallelism suites of e2e
  # among them.
  stress:
    name: Race and shuffle
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      GOWORK: "off"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Tests, shuffled, twice, with -race
        run: make stress

  # The tlsccm module: the cipher suite TLS_ECDHE_ECDSA_WITH_AES_128_CCM_8,
  # on the Go version and dependencies of its own go.mod.
  tlsccm:
    name: tlsccm (CCM_8)
    runs-on: ubuntu-latest
    env:
      GOWORK: "off"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: tlsccm/go.mod
          cache-dependency-path: tlsccm/go.sum
      - name: Install linters
        run: |
          go install honnef.co/go/tools/cmd/staticcheck@2026.2.2
          go install golang.org/x/vuln/cmd/govulncheck@v1.9.0
          curl -sSfL https://raw.githubusercontent.com/golangci/golangci-lint/v2.15.0/install.sh | sh -s -- -b "$(go env GOPATH)/bin" v2.15.0
      - name: Vet, lint and test
        run: make test-tlsccm

  # Runs the client and the server against IEEE 2030.5 implementations of
  # others: the images of github.com/otfabric/ieee20305-interop, pinned by
  # digest in interop/images.go; our client against the Envoy and GridAPPS-D
  # servers, and the GridAPPS-D, py20305 and EPRI clients against our server,
  # over CCM_8 (the tlsccm module) and GCM where both ends have it.
  interop:
    name: Interop
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      GOWORK: "off"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: interop/go.mod
          cache-dependency-path: interop/go.sum
      - name: Install linters
        run: |
          go install honnef.co/go/tools/cmd/staticcheck@2026.2.2
          curl -sSfL https://raw.githubusercontent.com/golangci/golangci-lint/v2.15.0/install.sh | sh -s -- -b "$(go env GOPATH)/bin" v2.15.0
      - name: Interop suite
        run: make test-interop
